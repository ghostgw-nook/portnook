# Push to claude/** -> tests -> merge into main -> tag vX.Y.Z from VERSION (if new) -> GitHub releases
# -> build/deploy (build.yml, only when files of the image changed) -> delete the claude/** branches already contained in main.
# Pushes made with GITHUB_TOKEN start no workflow, so the following steps are called directly.
name: Auto-merge

on:
  push:
    branches: ['claude/**']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  merge:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the branch into main
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retried on a fresh main: dependabot-auto-merge.yml can push to main at the same time.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset -q --hard origin/main
            if git merge-base --is-ancestor "$SHA" HEAD; then
              echo "$SHA is already in main"; exit 0
            fi
            git fetch origin "$SHA" || git fetch origin "$BRANCH"
            if ! git merge --ff-only "$SHA"; then
              git merge --no-ff --no-edit -m "Merge branch '$BRANCH' into main" "$SHA"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (main changed), attempt $attempt"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Tag the release from VERSION
        id: tag
        run: |
          set -euo pipefail
          git fetch origin main
          git reset -q --hard origin/main
          version=$(tr -d '[:space:]' < VERSION 2>/dev/null || true)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION '$version' is not X.Y.Z, no tag"; exit 0
          fi
          tag="v$version"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag exists, nothing to do"; exit 0
          fi
          git tag -a "$tag" -m "$tag" HEAD
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub releases (new tag and tags without a release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin
          .github/scripts/publish-releases.sh

      - name: Delete merged claude/** branches
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/claude/*:refs/remotes/origin/claude/*'
          git for-each-ref --format='%(refname:strip=3) %(objectname)' 'refs/remotes/origin/claude/' |
          while read -r branch sha; do
            if git merge-base --is-ancestor "$sha" origin/main; then
              # The lease keeps commits pushed after the fetch.
              git push origin --delete --force-with-lease="refs/heads/$branch:$sha" "$branch" ||
                echo "Kept $branch (changed or already gone)"
            fi
          done

  build:
    needs: [tests, merge]
    if: needs.tests.outputs.image == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: main
    permissions:
      contents: read
      packages: write
    secrets: inherit

  build-release:
    needs: merge
    if: needs.merge.outputs.tag != ''
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.merge.outputs.tag }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

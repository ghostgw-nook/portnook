# Build and push the agent image (multi-arch) to ghcr.io. Called by auto-merge.yml and dependabot-auto-merge.yml
# with the ref to build (main, and the new release tag when one was created); also weekly on main to pick up
# Alpine security fixes. Tags: ref main (or schedule) -> latest (schedule also X.Y.Z from VERSION);
# ref vX.Y.Z -> X.Y.Z, X.Y and latest; any other ref -> sanitized ref name.
# The Dockerfiles should accept ARG VERSION (passed as build arg) and write it to /app/VERSION.
name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (default: main)'
        required: false
        default: 'main'
  workflow_call:
    inputs:
      ref:
        type: string
        default: 'main'
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [agent]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Compute tags and version
        id: meta
        env:
          REF: ${{ inputs.ref || 'main' }}
          IMAGE: ghcr.io/ghostgw-nook/portnook
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          file_version=$(tr -d '[:space:]' < VERSION)
          tags=()
          if [[ "$REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version="${REF#v}"
            tags+=("$IMAGE:$version" "$IMAGE:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "$IMAGE:latest")
          elif [ "$REF" = main ]; then
            version="$file_version"
            tags+=("$IMAGE:latest")
            [ "$EVENT" = schedule ] && tags+=("$IMAGE:$version")
          else
            version="$file_version"
            tags+=("$IMAGE:$(printf '%s' "$REF" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[-.]*//' | cut -c1-100)")
          fi
          {
            echo "version=$version"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/ghostgw-nook/portnook
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-release
          cache-to: type=gha,scope=${{ matrix.image }}-release,mode=max

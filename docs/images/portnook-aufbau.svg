<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <rect width="820" height="300" rx="14" fill="#f4f6f8"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5a6877"/></marker></defs>
  <!-- internet -->
  <rect x="20" y="40" width="150" height="70" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="95" y="68" text-anchor="middle" font-weight="600" fill="#1c2430">Besucher</text>
  <text x="95" y="88" text-anchor="middle" fill="#5a6877" font-size="11">app.&lt;name&gt;.myaddr.tools</text>
  <rect x="20" y="190" width="150" height="70" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="95" y="218" text-anchor="middle" font-weight="600" fill="#1c2430">myaddr.tools</text>
  <text x="95" y="238" text-anchor="middle" fill="#5a6877" font-size="11">DNS + TXT für ACME</text>
  <rect x="230" y="40" width="160" height="70" rx="10" fill="#fff" stroke="#7c3aed"/>
  <text x="310" y="68" text-anchor="middle" font-weight="600" fill="#1c2430">Proton VPN</text>
  <text x="310" y="88" text-anchor="middle" fill="#5a6877" font-size="11">Exit-IP : NAT-PMP-Port</text>
  <rect x="230" y="190" width="160" height="70" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="310" y="218" text-anchor="middle" font-weight="600" fill="#1c2430">Let's Encrypt</text>
  <text x="310" y="238" text-anchor="middle" fill="#5a6877" font-size="11">Wildcard per DNS-01</text>
  <!-- home -->
  <rect x="440" y="20" width="360" height="260" rx="14" fill="#fff7ed" stroke="#f97316" stroke-dasharray="6 4"/>
  <text x="620" y="42" text-anchor="middle" font-weight="600" fill="#9a3412">Zuhause (kein offener Port)</text>
  <rect x="460" y="60" width="150" height="90" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/>
  <text x="535" y="88" text-anchor="middle" font-weight="700" fill="#1c2430">portnook</text>
  <text x="535" y="108" text-anchor="middle" fill="#5a6877" font-size="11">wg0 · DNAT · DDNS</text>
  <text x="535" y="124" text-anchor="middle" fill="#5a6877" font-size="11">ACME · Redirect</text>
  <rect x="640" y="60" width="140" height="90" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="710" y="88" text-anchor="middle" font-weight="600" fill="#1c2430">Reverse Proxy</text>
  <text x="710" y="108" text-anchor="middle" fill="#5a6877" font-size="11">NPM / Zoraxy</text>
  <text x="710" y="124" text-anchor="middle" fill="#5a6877" font-size="11">TLS endet hier</text>
  <rect x="640" y="190" width="140" height="70" rx="10" fill="#fff" stroke="#dde3ea"/>
  <text x="710" y="230" text-anchor="middle" font-weight="600" fill="#1c2430">Webdienst</text>
  <!-- arrows -->
  <path d="M170 75H226" stroke="#5a6877" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M390 75H456" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#a)"/>
  <text x="423" y="66" text-anchor="middle" fill="#7c3aed" font-size="11">WireGuard</text>
  <path d="M610 105H636" stroke="#5a6877" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M710 150V186" stroke="#5a6877" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M500 150C500 230 260 230 175 225" fill="none" stroke="#9aa8b7" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M560 150C560 200 470 225 394 225" fill="none" stroke="#9aa8b7" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="520" y="180" fill="#5a6877" font-size="11">durch den Tunnel</text>
  <path d="M590 150C600 170 630 140 650 150" fill="none" stroke="#9aa8b7" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="610" y="172" fill="#5a6877" font-size="10">Zertifikat</text>
